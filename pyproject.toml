[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.0.1"
description = "Framework-agnostic trajectory evaluation and regression harness for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentTrace contributors" }]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai-agents>=0.2",
    "agentdojo>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
agenttrace = "agenttrace.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
